<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beep Boops — First episode Fri Nov 20</title>
  <meta name="description" content="Beep Boops: three friends from the theatre arguing about AI, technology and what it means to be human. First episode Friday, November 20.">
  <meta name="theme-color" content="#012332">
  <meta property="og:title" content="Beep Boops">
  <meta property="og:description" content="First episode Fri Nov 20">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://beepboopspod.com/">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #012332;
      --cyan: #3cd8ff;
      --yellow: #fff1a3;
      --glow: rgba(255, 224, 89, 0.5);
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--cyan);
      font-family: "Silkscreen", ui-monospace, Menlo, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.5rem, 4vh, 3rem);
      padding: 2rem 1.25rem;
      text-align: center;
    }
    h1 { line-height: 0; }
    h1 img {
      width: min(88vw, 620px, 70vh);
      height: auto;
    }
    .launch {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .launch .label {
      font-size: clamp(0.85rem, 2.4vw, 1.1rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .launch .date {
      font-size: clamp(2rem, 8vw, 3.75rem);
      color: var(--yellow);
      text-shadow: 0 0 18px var(--glow), 0 0 4px var(--glow);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <h1><img src="title.svg" alt="Beep Boops" width="1163" height="983"></h1>
  <p class="launch">
    <span class="label">First Episode</span>
    <time class="date" datetime="2026-11-20">Fri Nov 20</time>
  </p>
</body>
</html>
